<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Village Introspect</title>
<script>
  (function(){ var t=null; try{ t=localStorage.getItem('theme'); }catch(e){}
    if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; })();
</script>
<style>
/* Tokens. Family hues in a fixed order (openai blue · anthropic orange · google aqua · other yellow),
   checked for colour-vision-deficiency separation in both modes. Fidelity uses the STATUS
   palette (never a series colour); --accent is reserved for selection, search hits and context. */
:root{
  color-scheme: light;
  --bg:#f6f6f3; --surface:#fcfcfb; --raised:#ffffff; --sunken:#efefeb;
  --ink:#1b1b1a; --muted:#52514e; --faint:#8a8984; --line:#e2e1dc; --line-2:#cfcec8; --lane:#c9c8c2;
  --f-openai:#2a78d6; --f-anthropic:#eb6834; --f-google:#1baf7a; --f-other:#eda100; --f-human:#6f6e69;
  --accent:#c42a6d; --accent-soft:rgba(196,42,109,.10); --mark:rgba(237,161,0,.35);
  --near:#0a8a0a; --near-soft:rgba(12,163,12,.09); --approx:#8a5d00; --approx-edge:#e3a008; --approx-soft:rgba(250,178,25,.13);
  --cf:#c23535; --cf-soft:rgba(208,59,59,.09); --shadow:0 8px 28px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --raised:#222220; --sunken:#171716;
    --ink:#ecebe7; --muted:#c3c2b7; --faint:#8d8c85; --line:#2d2d2a; --line-2:#3b3b37; --lane:#45443f;
    --f-openai:#3987e5; --f-anthropic:#d95926; --f-google:#199e70; --f-other:#c98500; --f-human:#9a9992;
    --accent:#f0609f; --accent-soft:rgba(240,96,159,.14); --mark:rgba(201,133,0,.45);
    --near:#3bc43b; --near-soft:rgba(12,163,12,.14); --approx:#fab219; --approx-edge:#fab219; --approx-soft:rgba(250,178,25,.11);
    --cf:#e5605a; --cf-soft:rgba(229,96,90,.13); --shadow:0 10px 32px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --raised:#222220; --sunken:#171716;
  --ink:#ecebe7; --muted:#c3c2b7; --faint:#8d8c85; --line:#2d2d2a; --line-2:#3b3b37; --lane:#45443f;
  --f-openai:#3987e5; --f-anthropic:#d95926; --f-google:#199e70; --f-other:#c98500; --f-human:#9a9992;
  --accent:#f0609f; --accent-soft:rgba(240,96,159,.14); --mark:rgba(201,133,0,.45);
  --near:#3bc43b; --near-soft:rgba(12,163,12,.14); --approx:#fab219; --approx-edge:#fab219; --approx-soft:rgba(250,178,25,.11);
  --cf:#e5605a; --cf-soft:rgba(229,96,90,.13); --shadow:0 10px 32px rgba(0,0,0,.55);
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; overflow:hidden; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:var(--raised); border:1px solid var(--line-2); border-radius:7px; padding:3px 10px; }
button:hover{ border-color:var(--faint); }
button.primary{ background:var(--ink); color:var(--surface); border-color:var(--ink); font-weight:600; }
button.ghost{ background:transparent; border-color:transparent; color:var(--muted); }
button.ghost:hover{ color:var(--ink); border-color:var(--line-2); }
button:disabled{ opacity:.45; cursor:not-allowed; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
input,select,textarea{ background:var(--raised); border:1px solid var(--line-2); border-radius:7px; padding:5px 9px; }
textarea{ resize:none; width:100%; }
code,pre,.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
mark{ background:var(--mark); color:inherit; border-radius:2px; padding:0 1px; }
.muted{ color:var(--muted); } .faint{ color:var(--faint); }
.kbd{ font:11px ui-monospace,monospace; border:1px solid var(--line-2); border-bottom-width:2px; border-radius:4px; padding:0 4px; color:var(--muted); background:var(--raised); }
.tag{ font-size:10px; border:1px solid var(--line-2); border-radius:3px; padding:0 4px; color:var(--faint); font-weight:500; white-space:nowrap; vertical-align:1px; }
.chip{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line-2); border-radius:999px; padding:2px 10px; background:var(--raised); cursor:pointer; white-space:nowrap; font-size:12.5px; }
.chip:hover{ border-color:var(--faint); }
.fd{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--f-human); flex:none; }
.fd.fg-openai{ background:var(--f-openai); } .fd.fg-anthropic{ background:var(--f-anthropic); } .fd.fg-google{ background:var(--f-google); } .fd.fg-other{ background:var(--f-other); }
.fd.hum{ background:transparent; border:1.5px solid var(--f-human); }

/* ------------------------------ shell: header + ONE pane (+ Ask when open) ------------------------------ */
#app{ display:grid; grid-template-rows:auto auto 1fr; grid-template-columns:minmax(0,1fr); height:100vh; }
header.top{ display:flex; align-items:center; gap:10px; height:48px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--line); min-width:0; }
.brand{ font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
.searchwrap{ position:relative; flex:1 1 auto; min-width:0; max-width:560px; }
#q{ width:100%; min-width:0; padding:7px 30px 7px 30px; border-radius:9px; background:var(--sunken); }
.searchwrap .ic{ position:absolute; left:10px; top:7px; color:var(--faint); pointer-events:none; }
#qclear{ position:absolute; right:5px; top:5px; padding:1px 7px; display:none; }
.suggest{ position:absolute; top:38px; left:0; right:0; background:var(--raised); border:1px solid var(--line-2); border-radius:9px; box-shadow:var(--shadow); padding:10px 12px; z-index:40; display:none; font-size:12.5px; }
.suggest .chips{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
.hdr-right{ display:flex; align-items:center; gap:6px; margin-left:auto; }
.focuschips{ display:flex; gap:6px; align-items:center; }
.fpill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--accent); border-radius:999px; padding:1px 4px 1px 9px; font-size:12.5px; white-space:nowrap; }
.fpill input{ margin:0; }
.fpill button{ border:0; background:none; padding:0 5px; color:var(--muted); }
#jobs{ display:none; } #jobs.on{ display:inline-flex; gap:6px; align-items:center; }
.pulse{ width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pl 1.2s infinite; flex:none; }
@keyframes pl{ 50%{ opacity:.25; } }
#stripband{ display:none; background:var(--surface); border-bottom:1px solid var(--line); }
body.v-strip #stripband{ display:block; }
#stripwrap{ position:relative; height:64px; min-width:0; overflow:hidden; }
#strip{ display:block; width:100%; height:100%; min-width:0; cursor:pointer; }

.panes{ display:grid; grid-template-columns:minmax(0,1fr) 0; min-height:0; }
body.ask-open .panes{ grid-template-columns:minmax(0,1fr) var(--ask-w,460px); }
#tlpane{ overflow-y:auto; min-height:0; position:relative; }
#tl{ max-width:1000px; margin:0 auto; padding:6px 20px 160px 12px; }
body.ask-open #tl{ max-width:none; }

/* ------------------------------ the timeline (git-branch style) ------------------------------ */
.lanehead{ position:sticky; top:0; z-index:5; display:flex; align-items:flex-end; background:var(--bg); padding:2px 0 3px; font-size:10.5px; color:var(--faint); border-bottom:1px solid var(--line); margin-bottom:4px; cursor:help; }
.lanehead .lh{ width:16px; flex:none; position:relative; height:44px; }
.lanehead .lh span{ position:absolute; bottom:2px; left:8px; transform:rotate(-55deg); transform-origin:left bottom; white-space:nowrap; color:var(--muted); }
.lanehead .hint{ margin-left:14px; padding-bottom:2px; }
.r{ display:flex; align-items:stretch; min-height:26px; }
.g{ position:relative; flex:none; }
.g svg{ position:absolute; left:0; top:0; height:100%; overflow:visible; }
.g .ln{ stroke:var(--lane); stroke-width:2; fill:none; }
.g .ln.q{ stroke-dasharray:2 3; }
.g .ln.ctx{ stroke:var(--accent); stroke-width:3; }
.b{ flex:1; min-width:0; padding:3px 8px 3px 6px; border-radius:7px; cursor:pointer; }
.b:hover{ background:var(--surface); }
.r.sel>.b{ background:var(--surface); box-shadow:inset 0 0 0 1px var(--line-2); }
.line1{ display:flex; align-items:baseline; gap:8px; min-width:0; line-height:20px; }
.line1 .tw{ flex:none; width:12px; color:var(--faint); font-size:10px; }
.caret{ display:inline-block; transition:transform .12s; } .r.open>.b .caret{ transform:rotate(90deg); }
.meta{ color:var(--faint); font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.sub{ color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.badge{ font-size:10.5px; border-radius:4px; padding:0 5px; border:1px solid var(--line-2); color:var(--muted); line-height:15px; white-space:nowrap; flex:none; }
.badge.cc{ border-color:var(--near); color:var(--near); } .badge.hit{ border-color:var(--accent); color:var(--accent); font-weight:650; }
.badge.help{ border-color:var(--cf); color:var(--cf); } .badge.foc{ border-color:var(--accent); color:var(--accent); }
.r.goal{ min-height:34px; } .r.goal>.b{ padding-top:12px; padding-bottom:2px; cursor:pointer; }
.r.goal>.b:hover{ background:none; } .r.goal>.b:hover .t{ color:var(--ink); }
.r.goal>.b .t{ font-weight:700; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.dayblock{ position:relative; }
.dayblock>.r.day{ position:sticky; top:var(--lh-h,0px); z-index:4; background:var(--bg); box-shadow:0 1px 0 var(--line); }
.dayblock>.r.day>.b{ background:var(--bg); }
.dnav{ margin-left:auto; display:inline-flex; gap:2px; }
.dnav button{ padding:0 7px; font-size:12px; }
.r.dayend>.b{ cursor:default; padding-bottom:10px; } .r.dayend>.b:hover{ background:none; }
.r.msg>.b .mh{ display:flex; align-items:baseline; gap:8px; line-height:20px; min-width:0; }
.mtext{ white-space:pre-wrap; word-break:break-word; margin:0 0 3px 44px; font-size:13.5px; line-height:1.5; }
.mtext pre{ background:var(--sunken); padding:6px 8px; border-radius:6px; overflow:auto; white-space:pre; font-size:12px; margin:4px 0; }
.mtext.clamp{ display:-webkit-box; -webkit-line-clamp:14; -webkit-box-orient:vertical; overflow:hidden; }
.r.msg.op .mtext{ font-weight:450; }
.linkish{ display:block; border:0; background:none; padding:0; margin:1px 0 2px 44px; color:var(--faint); font-size:12px; cursor:pointer; text-align:left; }
.linkish:hover{ color:var(--ink); text-decoration:underline; }
.r.msg .thinkbox{ margin:4px 0 6px 44px; }
.acts2{ margin-left:auto; display:inline-flex; gap:4px; opacity:0; flex:none; }
.r.msg:hover .acts2,.r.msg.sel .acts2,.r.msg.anchor .acts2{ opacity:1; }
.acts2 .askbtn{ opacity:1; }
.dots{ padding:0 7px; line-height:19px; }
.r.msg{ padding-bottom:4px; }
.r.era{ min-height:32px; } .r.era>.b{ padding-top:5px; padding-bottom:5px; }
.r.era.nohit,.r.day.nohit{ opacity:.45; }
.r.day>.b .t{ font-weight:600; white-space:nowrap; }
.r.msg>.b .who{ font-weight:600; white-space:nowrap; flex:none; max-width:190px; overflow:hidden; text-overflow:ellipsis; }
.r.msg>.b .tm{ color:var(--faint); font-size:11.5px; font-variant-numeric:tabular-nums; flex:none; width:36px; }
.r.msg>.b .pv{ color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.r.msg.op>.b .pv{ color:var(--ink); }
.r.msg.auto>.b{ opacity:.65; }
.r.msg.foc>.b{ box-shadow:inset 3px 0 0 var(--accent); }
.r.msg.help>.b .pv{ color:var(--cf); }
.r.msg.hitrow>.b .tm{ color:var(--accent); font-weight:700; }
.r.inctx>.b{ box-shadow:inset 2px 0 0 var(--accent); }
.r.anchor>.b{ background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent); }
.gly{ display:inline-flex; gap:5px; align-items:center; color:var(--faint); font-size:11px; flex:none; }
.g-th{ display:inline-flex; align-items:center; gap:1px; color:var(--muted); line-height:1; }
.g-th small{ font-size:9px; font-weight:700; }
.g-cc{ color:var(--near); border:1px solid var(--near); border-radius:3px; padding:0 3px; font-size:10px; line-height:13px; font-weight:650; }
.g-pr{ color:var(--accent); }
.room{ color:var(--faint); font-size:11px; }
.askbtn{ padding:0 9px; font-size:12px; line-height:19px; opacity:0; flex:none; }
.r.msg:hover .askbtn,.r.msg.sel .askbtn,.r.msg.open .askbtn{ opacity:1; }
.detail{ margin:4px 0 8px; padding:10px 12px; background:var(--raised); border:1px solid var(--line); border-radius:9px; cursor:auto; }
.detail .dm{ margin-top:8px; font-size:11.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
.thinkbox{ margin-top:9px; border-left:3px solid var(--line-2); padding:2px 0 2px 10px; }
.thinkbox summary{ cursor:pointer; color:var(--muted); font-size:12.5px; }
.thinkbox .tt{ white-space:pre-wrap; font-size:13px; color:var(--muted); margin-top:5px; font-style:italic; }
.kv{ display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; font-size:12px; margin-top:6px; }
.kv .k{ color:var(--faint); } .kv .v{ white-space:pre-wrap; word-break:break-word; }
.r.util>.b{ color:var(--faint); font-size:12px; padding-top:2px; padding-bottom:2px; }
.r.util>.b:hover{ color:var(--ink); }
.r.util.failed>.b{ color:var(--cf); cursor:default; } .r.util.failed>.b button{ margin-left:8px; padding:0 8px; font-size:12px; }
.aboutbox{ margin:4px 0 8px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--raised); cursor:auto; font-size:12.5px; }
.aboutbox h4{ margin:10px 0 4px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:650; }
.aboutbox h4:first-child{ margin-top:0; }
.agchip{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:6px; padding:1px 7px 1px 6px; font-size:12px; cursor:pointer; background:var(--surface); margin:0 2px 3px 0; }
.agchip .n{ color:var(--faint); } .agchip.on{ border-color:var(--accent); }
.li{ display:flex; gap:7px; padding:2px 4px; border-radius:5px; cursor:pointer; align-items:baseline; }
.li:hover{ background:var(--sunken); }
.li .tm{ color:var(--faint); font-variant-numeric:tabular-nums; flex:none; font-size:11.5px; }
.li .tx{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.r.start>.b{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; cursor:default; padding:8px 10px; margin:4px 0 8px; background:var(--surface); border:1px solid var(--line); }
.r.start>.b:hover{ background:var(--surface); }
.r.cchead>.b{ border:1px solid var(--near); background:var(--near-soft); margin:3px 0; cursor:default; }
.tool{ font:11px ui-monospace,monospace; border:1px solid var(--line-2); border-radius:4px; padding:0 4px; white-space:nowrap; background:var(--sunken); }
.tool.chat{ border-color:var(--accent); color:var(--accent); }
.r.turn>.b .x{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.turnbody .blk{ margin:6px 0; } .turnbody .lb{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); margin-bottom:2px; }
.turnbody pre{ margin:0; white-space:pre-wrap; word-break:break-word; font-size:12px; background:var(--sunken); padding:6px 8px; border-radius:5px; }
.turnbody .think{ white-space:pre-wrap; font-style:italic; color:var(--muted); font-size:12.5px; }
.r.gap{ min-height:12px; }
.r.gap>.b{ padding:0 8px; font-size:11px; color:transparent; line-height:12px; }
.r.gap:hover>.b,.r.gap.sel>.b{ color:var(--accent); }
.r.gap.sel>.b{ background:var(--accent-soft); }
.home-empty{ color:var(--muted); padding:30px 10px; }
.skel{ background:linear-gradient(90deg,var(--sunken),var(--line),var(--sunken)); background-size:200% 100%; animation:sk 1.4s infinite; border-radius:5px; }
@keyframes sk{ to{ background-position:-200% 0; } }

/* ------------------------------ Ask pane ------------------------------ */
aside.ask{ display:none; flex-direction:column; min-height:0; background:var(--surface); border-left:1px solid var(--line); position:relative; }
body.ask-open aside.ask{ display:flex; }
.askresize{ position:absolute; left:-4px; top:0; bottom:0; width:8px; cursor:col-resize; z-index:5; }
.ahead{ padding:10px 14px 8px; border-bottom:1px solid var(--line); flex:none; }
.ahead .row1{ display:flex; align-items:center; gap:7px; }
.ahead select{ font-weight:650; max-width:250px; padding:3px 6px; }
.ahead .x{ margin-left:auto; }
.ahead .where{ color:var(--muted); font-size:12.5px; margin-top:3px; }
.fidchip{ margin-top:8px; border:1px solid var(--line-2); border-left-width:4px; border-radius:8px; padding:5px 9px; font-size:12.5px; cursor:pointer; }
.fidchip.near{ border-color:var(--near); background:var(--near-soft); } .fidchip.approx{ border-color:var(--approx-edge); background:var(--approx-soft); }
.fidchip .bd{ font-size:10.5px; font-weight:750; letter-spacing:.06em; margin-right:6px; }
.fidchip.near .bd{ color:var(--near); } .fidchip.approx .bd{ color:var(--approx); }
.fidchip .cf{ color:var(--cf); font-size:10.5px; font-weight:750; letter-spacing:.06em; margin-right:6px; }
.fidchip .more{ color:var(--faint); float:right; }
.fiddetail{ margin-top:6px; font-size:12.5px; color:var(--muted); cursor:auto; }
.fiddetail ul{ margin:3px 0 0; padding-left:17px; }
.fiddetail .w{ margin-top:4px; display:flex; gap:6px; }
.fiddetail .w .ii{ flex:none; display:inline-grid; place-items:center; width:1.1em; height:1.1em; margin-top:.2em; border:1px solid currentColor; border-radius:50%; font:italic 700 .7em/1 Georgia,serif; } .fiddetail .w.warn{ color:var(--approx); } .fiddetail .w.counterfactual{ color:var(--cf); font-weight:600; }
.athread{ flex:1; overflow-y:auto; padding:12px 14px; min-height:0; }
.empty-ask{ color:var(--muted); font-size:13px; }
.quote{ margin:8px 0; border-left:3px solid var(--line-2); padding:3px 0 3px 10px; color:var(--muted); font-size:12.5px; white-space:pre-line; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
.quote.full{ display:block; -webkit-line-clamp:unset; }
.bubble-q{ margin:14px 0 6px auto; max-width:88%; background:var(--sunken); border-radius:12px 12px 3px 12px; padding:7px 11px; width:fit-content; white-space:pre-wrap; }
.bubble-q .mode{ font-size:10.5px; color:var(--faint); display:block; }
.bubble-a{ margin:4px 0 4px; max-width:96%; background:var(--raised); border:1px solid var(--line); border-radius:12px 12px 12px 3px; padding:8px 12px; }
.bubble-a.err{ border-color:var(--cf); color:var(--cf); }
.bubble-a .stopw{ color:var(--cf); font-size:12.5px; font-weight:600; margin-bottom:4px; }
.bubble-a .txt{ white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.55; }
.bubble-a details{ margin-top:6px; font-size:12.5px; } .bubble-a summary{ cursor:pointer; color:var(--muted); }
.bubble-a details .tt{ white-space:pre-wrap; color:var(--muted); font-style:italic; margin-top:4px; }
.alinks{ display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; margin:2px 0 4px 4px; }
.alinks a{ color:var(--faint); cursor:pointer; text-decoration:none; } .alinks a:hover{ color:var(--ink); text-decoration:underline; }
.cmp{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
.cmp>div{ border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
.cmp .lb{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); margin-bottom:3px; white-space:normal; }
.spin{ color:var(--muted); font-style:italic; display:flex; align-items:center; gap:7px; }
.composer{ border-top:1px solid var(--line); padding:9px 14px 12px; flex:none; background:var(--surface); }
.composer .sugg{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.composer .row2{ display:flex; align-items:center; gap:8px; margin-top:7px; }
.seg{ display:inline-flex; border:1px solid var(--line-2); border-radius:7px; overflow:hidden; }
.seg button{ border:0; border-radius:0; padding:2px 10px; background:var(--raised); font-size:12.5px; }
.seg button.on{ background:var(--ink); color:var(--surface); }

<body>
<div id="app">
  <header class="top">
    <div class="brand">Village Introspect</div>
    <div class="searchwrap">
      <span class="ic">⌕</span>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search, or jump to a day (447, 2026-06-22)…  press /" aria-label="Search messages or jump to a day">
      <button id="qclear" class="ghost" title="Clear search (Esc)">✕</button>
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="focuschips" id="focuschips"></div>
    <div class="hdr-right">
      <button id="jobs" title="Questions being answered"><span class="pulse"></span><span id="jobsn">0</span></button>
      <button id="viewbtn" title="Add detail to the view">View ▾</button>
      <button id="helpbtn" class="ghost opt" title="Keyboard shortcuts (?)">?</button>
      <button id="themebtn" class="ghost" title="Toggle light/dark">◐</button>
    </div>
  </header>
  <div id="stripband"><div id="stripwrap"><svg id="strip" role="img" aria-label="Messages per day across the whole village, stacked by model family"></svg></div></div>
  <div class="panes">
    <div id="tlpane"><div id="tl"></div></div>
    <aside class="ask" aria-label="Ask a model">
      <div class="askresize" id="askresize" title="Drag to resize"></div>
      <div class="ahead" id="ahead"></div>
      <div class="athread" id="athread"></div>
      <div class="composer" id="composer"></div>
      <div class="opts" id="opts"></div>
    </aside>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* =============================================================================================
   Village Introspect — one pane by default: a vertical, collapsible, git-branch-style timeline.
   Lanes = chat rooms (#general is the trunk; #best/#rest/#focus branch off and merge back — the
   village's real room structure). Goals (eras) → days → messages expand in place. A second pane (Ask)
   opens on the right only when you ask a model something. Everything else is opt-in (View ▾, search, focus).
   ============================================================================================= */
const FG = ['openai','anthropic','google','other'];
const FGNAME = {anthropic:'Anthropic', openai:'OpenAI', google:'Google', other:'Other'};
const LANES = [{k:'general', l:'#general'}, {k:'best', l:'#best'}, {k:'rest', l:'#rest'}, {k:'focus', l:'#focus'}, {k:'other', l:'other rooms'}];
const CC_LANE = LANES.length;                          // an extra lane for an open Claude Code side branch
const LW = 16, NY = 13;                                // lane width, node y within a row
const laneOf = room => { const i = LANES.findIndex(l=>l.k===room); return i>=0 ? i : 4; };
const S = {
  ov:null, dayIdx:new Map(), activeDays:[], agents:{}, eras:[],
  days:new Map(), ev:new Map(), loading:new Set(), failed:new Map(),
  open:{eras:new Set(), days:new Set(), msgs:new Set(), about:new Set(), runs:new Set(), hidden:new Set(), more:new Set(), copies:new Set(), think:new Set()},
  sel:null, q:'', search:null, dayHits:new Map(), hitsOnly:true,
  focus:[], only:false, cc:new Map(), ask:null, ctx:null, jobs:new Map(), models:null, stars:[],
  view:{act:false, strip:false, newest:false, lanes:true, compact:false},
  startDismissed:false, _curDay:null, _lastHashDay:null,
};
const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const esc = s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n=>(n==null?'–':Number(n).toLocaleString('en-US'));
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
const fgOf = ev => ev.h ? 'human' : (FG.includes(ev.fg) ? ev.fg : 'other');
const dot = fg => fg==='human' ? '<i class="fd hum"></i>' : `<i class="fd fg-${esc(fg)}"></i>`;
function shortDate(iso){ if(!iso) return ''; return new Date(iso+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}); }
function tsec(t){ if(!t) return 0; const p=t.split(':'); return (+p[0])*3600+(+p[1])*60+(+(p[2]||0)); }
function agentName(slug){ const a=S.agents[slug]; return a?a.name:(slug||''); }
function toast(html, ms=5000){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=html; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); return t; }
const TH_SVG='<svg width="13" height="11" viewBox="0 0 13 11" aria-hidden="true"><path d="M3.2 7.6C1.6 7.6.6 6.5.6 5.2S1.7 2.8 3 2.9C3.4 1.5 4.7.6 6.2.6c1.4 0 2.6.8 3 2 1.8-.1 3.2 1.1 3.2 2.6 0 1.4-1.2 2.4-2.8 2.4z" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="2.4" cy="9.6" r="1" fill="currentColor"/></svg>';
function thKind(th){ return th==='verbatim'?`<span class="g-th" title="the agent's own thinking is logged here">${TH_SVG}</span>`: th==='summary'?`<span class="g-th" title="an OpenAI reasoning summary is logged here">${TH_SVG}<small>S</small></span>`: th==='reasoning'?`<span class="g-th" title="its logged reasoning (reasoning text returned by the provider)">${TH_SVG}<small>R</small></span>`: th?`<span class="g-th" title="thinking logged">${TH_SVG}</span>`:''; }
function markTerms(html, terms){ if(!terms||!terms.length) return html; let out=html;
  terms.forEach(t=>{ if(!t) return; const tr=new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    out=out.replace(/(^|>)([^<]*)/g,(m,a,txt)=>a+txt.replace(tr, x=>`<mark>${x}</mark>`)); }); return out; }
function fmtContent(txt, terms){ const out=[]; const re=/```([\s\S]*?)```/g; let last=0, m;
  while((m=re.exec(txt))){ out.push(markTerms(esc(txt.slice(last,m.index)),terms)); out.push(`<pre>${esc(m[1].replace(/^\w*\n/,''))}</pre>`); last=re.lastIndex; }
  out.push(markTerms(esc(txt.slice(last)),terms)); return out.join(''); }
function span(t0,t1){ const f=(t,wd)=>{ if(!t) return ''; const d=t.slice(0,10), hm=t.slice(11,16); return wd?`${new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'})} ${hm}`:hm; };
  if(!t0||!t1) return ''; return t0.slice(0,10)===t1.slice(0,10) ? `${f(t0)}–${f(t1)}` : `${f(t0,true)} – ${f(t1,true)}`; }

async function api(path, opts){
  const r = await fetch(path, opts); let j=null;
  try{ j = await r.json(); }catch(e){ throw new Error(`bad response (${r.status})`); }
  if(!r.ok){ const e=new Error((j&&j.error)||`HTTP ${r.status}`); e.status=r.status; e.body=j; throw e; }
  return j;
}
const post=(path,body)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

/* ------------------------------------------ boot ------------------------------------------ */
async function boot(){
  loadViewPrefs(); wire();
  const t0=Date.now();
  for(;;){
    let st=null; try{ st=await api('/api/status'); }catch(e){ st={stage:'server unreachable'}; }
    if(st && st.ready) break;
    if(st && st.stage==='error'){ $('#tl').innerHTML=`<div class="home-empty">Server error: ${esc(st.error||'')}</div>`; return; }
    $('#tl').innerHTML = `<div class="home-empty"><div class="spin"><span class="pulse"></span>Loading the village… <b>${esc(st&&st.stage||'')}</b> · ${Math.round((Date.now()-t0)/1000)}s</div>
      <div class="faint" style="margin-top:6px">The server indexes ~380k events on start (about 1–2 minutes).</div>
      ${Array.from({length:12},(_,i)=>`<div class="skel" style="height:26px;margin:9px 0 9px ${18+(i%3)*14}px;opacity:${1-i*.07}"></div>`).join('')}</div>`;
    await sleep(1500);
  }
  S.ov = await api('/api/overview'); indexOverview();
  api('/api/models').then(m=>{ S.models=m; }).catch(()=>{});
  api('/api/stars').then(s=>{ S.stars=s||[]; }).catch(()=>{});
  api('/api/jobs').then(js=>{ (js||[]).forEach(j=>{ if(j.status==='queued'||j.status==='running') trackJob(j.job_id, j.probe_id, null); }); }).catch(()=>{});
  new ResizeObserver(()=>drawStrip()).observe($('#stripwrap'));
  window.addEventListener('hashchange', applyHash);
  let _rw=innerWidth; window.addEventListener('resize', ()=>{ if((_rw<760)!==(innerWidth<760)) render(); _rw=innerWidth; });
  document.body.dataset.ready='1';
  await applyHash();
}
function indexOverview(){
  const ov=S.ov;
  ov.days.forEach(d=>S.dayIdx.set(d.day,d));
  S.activeDays = ov.days.map(d=>d.day).sort((a,b)=>a-b);
  ov.agents.forEach(a=>{ S.agents[a.slug]=a; });
  // per-era aggregates + lanes (rooms with ≥1% of the era's messages)
  S.eras = ov.eras.map((e,i)=>{
    const ds = S.activeDays.filter(d=>d>=e.start_day && d<=e.end_day).map(d=>S.dayIdx.get(d));
    const rooms={}, fg={openai:0,anthropic:0,google:0,other:0}; let n=0, help=0, cc=0;
    ds.forEach(d=>{ Object.entries(d.rooms||{}).forEach(([k,v])=>{ rooms[k]=(rooms[k]||0)+v; }); FG.forEach(f=>fg[f]+=(d.fg[f]||0)); n+=d.n_msgs; help+=d.n_help||0; cc+=d.cc?1:0; });
    const tot=Object.values(rooms).reduce((a,b)=>a+b,0)||1;
    const lanes=new Set([0]); Object.entries(rooms).forEach(([k,v])=>{ if(v/tot>=0.01) lanes.add(laneOf(k)); });
    return Object.assign({}, e, {i, days:ds.map(d=>d.day), rooms, fg, n, help, cc, lanes, quietTrunk: !(rooms.general>0)});
  });
  S.eras.forEach(e=>e.days.forEach(d=>{ S.dayIdx.get(d)._era=e.i; }));
}
function dayLanes(d){
  const x=S.dayIdx.get(d); const lanes=new Set([0]); if(!x) return lanes;
  const tot=Object.values(x.rooms||{}).reduce((a,b)=>a+b,0)||1;
  Object.entries(x.rooms||{}).forEach(([k,v])=>{ if(v>=3 || v/tot>=0.02) lanes.add(laneOf(k)); });
  return lanes;
}

/* ------------------------------------------ view prefs ------------------------------------------ */
function loadViewPrefs(){ try{ Object.assign(S.view, JSON.parse(ls('viewPrefs')||'{}')); }catch(e){} S.startDismissed = ls('startDismissed')==='1'; applyViewClasses(); }
function saveViewPrefs(){ ls('viewPrefs', JSON.stringify(S.view)); applyViewClasses(); }
function applyViewClasses(){ document.body.classList.toggle('v-strip', !!S.view.strip); document.body.classList.toggle('v-compact', !!S.view.compact); }

/* ------------------------------------------ routing ------------------------------------------ */
// #/                       collapsed timeline
// #/day/447?m=<ei>&q=&focus=a,b&only=1&cc=<seg>[@<ei>]&ask=<spec>
// #/probe/<id>
function parseHash(){
  const h=location.hash.replace(/^#/,'')||'/'; const [path,qs]=h.split('?'); const p=new URLSearchParams(qs||'');
  const seg=path.split('/').filter(Boolean); const r={view:'home', p};
  if(seg[0]==='day' && seg[1]){ r.view='day'; r.day=+seg[1]; }
  else if(seg[0]==='probe' && seg[1]){ r.view='probe'; r.probe=seg[1]; }
  return r;
}
function buildHash(){
  const p=new URLSearchParams();
  if(S.sel && S.sel.startsWith('m')) p.set('m', S.sel.slice(1));
  if(S.q) p.set('q', S.q);
  if(S.focus.length) p.set('focus', S.focus.join(','));
  if(S.only) p.set('only','1');
  const C=[...S.cc.values()][0]; if(C) p.set('cc', C.seg_id+(C.anchor!=='about'?'@'+C.anchor:''));
  if(S.ask && S.ask.spec) p.set('ask', encodeAsk(S.ask.spec));
  const d=S._curDay; const qs=p.toString();
  return '#'+(d!=null?`/day/${d}`:'/')+(qs?'?'+qs:'');
}
function pushHash(){ const h=buildHash(); if(h!==location.hash) location.hash=h; }
function replaceHash(){ const h=buildHash(); if(h!==location.hash) history.replaceState(null,'',h); }
function encodeAsk(s){ return s.target==='cc' ? (s.at_ei!=null?`ccat.${s.at_ei}.${s.anchor||'after'}`:`cc.${s.seg_id}.${s.seq}`) : `tierb.${s.agent}.${s.ei}.${s.anchor||'after'}`; }
function decodeAsk(x){ if(!x) return null; const p=x.split('.');
  if(p[0]==='cc' && p.length>=3) return {target:'cc', seg_id:+p[1], seq:+p[2]};
  if(p[0]==='ccat') return {target:'cc', at_ei:+p[1], anchor:p[2]==='before'?'before':'after'};
  if(p[0]==='tierb' && p.length>=4) return {target:'tierb', agent:p.slice(1,-2).join('.'), ei:+p[p.length-2], anchor:p[p.length-1]};
  return null; }
let _applying=false;
async function applyHash(){
  if(_applying) return; _applying=true;
  try{
    const r=parseHash(), p=r.p;
    const navigated = r.view==='day' && (r.day!==S._lastHashDay || (p.get('m')!=null && 'm'+p.get('m')!==S.sel));
    S.focus=(p.get('focus')||'').split(',').filter(Boolean); S.only=p.get('only')==='1';
    renderFocusChips();
    const q=p.get('q')||'';
    if(q!==S.q){ S.q=q; $('#q').value=q; if(q) await runSearch(q,{fromHash:true}); else clearSearch(true); }
    if(r.view==='probe'){ await openProbePermalink(r.probe); return; }
    if(r.view==='day'){
      S._curDay=r.day;
      if(r.day!==S._lastHashDay){                      // navigating TO a day (deep link / goto): reveal it + its moment
        await revealDay(r.day);
        const m=p.get('m'); if(m!=null) S.sel='m'+m;
      }
      const cc=p.get('cc');
      if(cc){ const [seg,anc]=cc.split('@'); const anchor = anc!=null ? +anc : 'about'; const C=[...S.cc.values()][0];
        if(!C || C.seg_id!==+seg || C.anchor!==anchor) await openCCBranch(+seg, anchor, r.day, {silent:true}); }
    } else { S._curDay=null; }
    S._lastHashDay = r.view==='day' ? r.day : null;
    render(navigated ? {scrollTo: S.sel ? {key:S.sel} : {key:'d'+r.day, frac:0}} : {});
    const ask=decodeAsk(p.get('ask'));
    if(ask){ if(!S.ask || encodeAsk(S.ask.spec)!==encodeAsk(ask)) openAsk(ask,{fromHash:true}); }
    else if(S.ask) closeAsk(true);
  } finally { _applying=false; }
}
async function revealDay(day){ const x=S.dayIdx.get(day); if(!x) return; S.open.days=new Set([day]); S.failed.delete(day); await ensureDay(day); }
function goto(day, ei){
  S._curDay=day; if(ei!=null) S.sel='m'+ei;
  revealDay(day).then(()=>{ render({scrollTo: ei!=null ? {key:'m'+ei, pulse:true} : {key:'d'+day, frac:0}}); S._lastHashDay=day; pushHash(); });
}
/* ------------------------------------------ data ------------------------------------------ */
async function ensureDay(day){
  if(S.days.has(day)) return S.days.get(day);
  if(S.loading.has(day)){ while(S.loading.has(day)) await sleep(80); return S.days.get(day); }
  S.loading.add(day);
  try{ const d=await api('/api/day?full=1&day='+day); S.days.set(day,d); S.failed.delete(day); if(S.q) loadDayHits(day); return d; }   // full text: messages show expanded
  catch(e){ S.failed.set(day, e.message); toast(`Couldn't load day ${esc(day)}: ${esc(e.message)}`); return null; }   // buildRows shows a Retry row; no automatic re-request
  finally{ S.loading.delete(day); }
}
async function getEvent(ei){ if(S.ev.has(ei)) return S.ev.get(ei); const e=await api('/api/event?ei='+ei); S.ev.set(ei,e); return e; }
function findEv(ei){ for(const D of S.days.values()){ const e=D.events.find(x=>x.ei===ei); if(e) return {e, D}; } return null; }

/* ------------------------------------------ build the visible rows ------------------------------------------ */
/* Days grouped under goal labels; ONE day open at a time, its messages shown expanded below it. */
function buildRows(){
  const rows=[];
  if(!S.startDismissed && !S.q) rows.push({t:'start', key:'start', lanes:new Set(), node:null});
  const eras = S.view.newest ? S.eras.slice().reverse() : S.eras;
  const hits = S.search ? S.search.per_day : null;
  eras.forEach(e=>{
    let days = (S.view.newest ? e.days.slice().reverse() : e.days.slice()).filter(d=>S.view.act || S.dayIdx.get(d).n_msgs>0 || S.open.days.has(d));
    if(!days.length) return;
    const eh = hits ? e.days.reduce((s,d)=>s+(hits[d]||0),0) : 0;
    if(hits && S.hitsOnly){ days = days.filter(d=>hits[d] || S.open.days.has(d)); if(!days.length) return; }
    rows.push({t:'goal', key:'e'+e.i, era:e, lanes:new Set(e.lanes), node:0, quiet:e.quietTrunk, hits:eh});
    days.forEach(d=>{
      const dl=dayLanes(d); const x=S.dayIdx.get(d); const open=S.open.days.has(d);
      rows.push({t:'day', key:'d'+d, day:d, lanes:dl, node:0, quiet:!(x.rooms&&x.rooms.general), hits:hits?(hits[d]||0):0, nohit:!!hits && !hits[d], block:open?'start':null});
      if(!open) return;
      const D=S.days.get(d);
      if(!D && S.failed.has(d)){ rows.push({t:'util', key:'L'+d, lanes:dl, node:null, text:`Couldn't load day ${d}: ${S.failed.get(d)}`, retry:d, block:'end'}); return; }
      if(!D){ rows.push({t:'util', key:'L'+d, lanes:dl, node:null, text:'loading…', block:'end'}); if(!S.loading.has(d)) ensureDay(d).then(()=>render()); return; }
      rows.push({t:'about', key:'a'+d, day:d, lanes:dl, node:0});
      const ccA=S.cc.get('about:'+d); if(ccA) pushCC(rows, ccA, dl);
      pushMessages(rows, D, dl);
      rows.push({t:'dayend', key:'z'+d, day:d, lanes:dl, node:null, block:'end'});
    });
  });
  return rows;
}
function roomKey(room){ return room || 'general'; }
function msgRow(e, dl, extra){ const ln=laneOf(roomKey(e.room)); return Object.assign({t:'msg', key:'m'+e.ei, ev:e, lanes:dl.has(ln)?dl:new Set([...dl, ln]), node:ln}, extra||{}); }
/* The same text posted in several rooms within 2h (e.g. a goal announcement re-posted to #best and
   #rest) folds into its first copy, which says where else it went; the copies open on demand. */
function crossPosts(D){

/* ------------------------------------------ search (filters the timeline in place) ------------------------------------------ */
async function runSearch(q, opts={}){

  let r; try{ r=await api('/api/search?q='+encodeURIComponent(q)+'&limit=500'); }catch(e){ toast('Search: '+esc(e.message)); return; }
  if(r.jump){ $('#q').value=''; S.q=''; S.search=null; S.dayHits.clear(); goto(r.jump.day, r.jump.ei); return; }
  S.q=q; S.search=r; S.dayHits.clear(); $('#qclear').style.display='block';
  const pd=r.per_day; const days=Object.keys(pd).map(Number);
  if(days.length && !opts.fromHash){ const top=days.reduce((a,b)=>pd[b]>pd[a]?b:a, days[0]); S.open.days=new Set([top]); S._curDay=top; S._lastHashDay=top; await ensureDay(top); await loadDayHits(top); }
  [...S.open.days].forEach(d=>{ if(!S.dayHits.has(d)) loadDayHits(d); });
  render(!opts.fromHash && S._curDay!=null ? {scrollTo:{key:'d'+S._curDay, frac:0}} : {});
  if(!opts.fromHash){ replaceHash();
    toast(`${fmt(r.total)} hit${r.total===1?'':'s'} across ${days.length} day${days.length===1?'':'s'} · press <b>n</b> / <b>N</b> to step through them`, 4000); }
}
async function loadDayHits(day){ if(!S.q) return; try{ const r=await api(`/api/search?q=${encodeURIComponent(S.q)}&days=${day}-${day}&limit=5000`); S.dayHits.set(day, new Set(r.hits.map(h=>h.ei))); render(); }catch(e){} }

  let curEi = S.sel&&S.sel.startsWith('m') ? +S.sel.slice(1) : null; let day = S._curDay!=null&&pd[S._curDay] ? S._curDay : (dir>0?days[0]:days[days.length-1]);

    await ensureDay(day); if(!S.dayHits.has(day)) await loadDayHits(day);
    const D=S.days.get(day); const xp=D?crossPosts(D):null;          // skip folded cross-post copies (same text as a shown hit)
    const hs=[...(S.dayHits.get(day)||[])].filter(x=>!xp || !xp.copyOf.has(x) || S.open.copies.has(xp.copyOf.get(x))).sort((a,b)=>a-b);
    const nxt = dir>0 ? hs.find(x=>curEi==null||x>curEi) : hs.filter(x=>curEi==null||x<curEi).pop();

  if(document.querySelector(`#tl .r[data-key="m${ei}"]`)) setSel('m'+ei);
  getEvent(ei).then(full=>{
    if(full.probe && full.probe.tier==='cc') openAsk({target:'cc', at_ei:ei, anchor:'after'});   // server maps it to the turn that posted it
    else openAsk({target:'tierb', agent:f.e.slug, ei, anchor:'after'});
  });
}
function suggestAgents(ei){

  const list=[...by.values()].sort((a,b)=>a.dt-b.dt);

}

  $('#opts').addEventListener('click', ev=>{ const t=ev.target.closest('button'); if(!t) return; const d=t.dataset;
    if(d.exact!=null) showExactPrompt(); if(d.history!=null) showHistory(); if(d.optsclose!=null){ S.ask.optsOpen=false; renderOpts(); } });
  const rz=$('#askresize'); let sx=null, sw=null;
  rz.addEventListener('mousedown', ev=>{ sx=ev.clientX; sw=$('aside.ask').offsetWidth; ev.preventDefault(); });
  window.addEventListener('mousemove', ev=>{ if(sx==null) return; document.documentElement.style.setProperty('--ask-w', clamp(sw+(sx-ev.clientX), 360, Math.min(820, innerWidth*.6))+'px'); });
  window.addEventListener('mouseup', ()=>{ sx=null; });
}
async function sendProbe(question, mode){
  const A=S.ask; if(!A||!A.prompt) return; const s=A.spec; const m=mode||s.mode||'belief';
  const q = question!=null ? question : (m==='resample' ? '' : ($('#askq')?$('#askq').value.trim():''));
  const body=Object.assign(specParams(Object.assign({}, s, {mode:m}), q), {model:s.model||(S.models&&S.models.default)||'claude-opus-4-8'});
  let r; try{ r=await post('/api/probe', body); }catch(e){ toast('Ask failed: '+esc(e.message)); return; }
  const card={job_id:r.job_id, probe_id:r.probe_id, status:r.status||'queued', question:q, mode:m, model:body.model, agent:(A.prompt.resolved||{}).agent||s.agent, elapsed:0, followups:[]};
  A.cards.push(card); A.question=''; renderAsk(); const th=$('#athread'); th.scrollTop=th.scrollHeight; trackJob(r.job_id, r.probe_id, card);
}
async function sendFollowup(probe_id, question){
  const A=S.ask; const c=A.cards.find(x=>x.probe_id===probe_id||(x.followups||[]).some(f=>f.probe_id===probe_id)); if(!c) return;
  const lastId=(c.followups&&c.followups.length)?c.followups[c.followups.length-1].probe_id:c.probe_id;
  let r; try{ r=await post('/api/probe',{parent_id:lastId, question}); }catch(e){ toast('Follow-up failed: '+esc(e.message)); return; }
  const f={job_id:r.job_id, probe_id:r.probe_id, question, status:'queued'}; c.followups.push(f); if(document.activeElement) document.activeElement.blur(); renderAsk(); trackJob(r.job_id, r.probe_id, f);
}
function trackJob(job_id, probe_id, target){ S.jobs.set(job_id,{job_id, probe_id, target, t0:Date.now()}); updJobs(); if(!S._jt) S._jt=setInterval(pollJobs,2000); }
async function pollJobs(){
  if(!S.jobs.size){ clearInterval(S._jt); S._jt=null; updJobs(); return; }
  for(const [id,J] of [...S.jobs]){
    let j; try{ j=await api('/api/job?id='+encodeURIComponent(id)); }catch(e){ if(e.status===404) S.jobs.delete(id); continue; }
    const t=J.target; if(t){ t.status=j.status; t.elapsed=j.elapsed_s; }
    const el=document.querySelector(`[data-elapsed="${CSS.escape(id)}"]`); if(el) el.textContent=Math.round(j.elapsed_s||0)+'s';
    if(j.status==='done'||j.status==='error'){
      S.jobs.delete(id); const res=j.result||{};
      if(t){ if(j.status==='done'){ t.result=res; if(t.text===undefined) t.text=res.text; } else { t.error=j.error||res.error; if(res.text) t.result=res; } }
      if(j.status==='done'){
        if(!S.ask || !t){ const tt=toast(`Answer ready · ${esc(agentName(res.agent||''))} <button>View</button>`); tt.querySelector('button').onclick=()=>{ location.hash='#/probe/'+j.probe_id; }; }
        if(res.day!=null && !res.parent_id){ S.ov.probes_by_day=S.ov.probes_by_day||{}; S.ov.probes_by_day[res.day]=(S.ov.probes_by_day[res.day]||0)+1; }
        const aei=res.resolved&&res.resolved.ei; const f=aei!=null?findEv(aei):null; if(f&&!res.parent_id) f.e.n_probes=(f.e.n_probes||0)+1; }
      else toast('Error: '+esc(j.error||''));
      if(S.ask) renderAsk(); render();
    }
  }
  updJobs();
}
function updJobs(){ $('#jobs').classList.toggle('on', S.jobs.size>0); $('#jobsn').textContent=S.jobs.size; }
async function showExactPrompt(){ const A=S.ask; if(!A) return; const qs=new URLSearchParams(specParams(A.spec, ($('#askq')&&$('#askq').value.trim())||A.question||''));
  let p; try{ p=await api('/api/probe/prompt?'+qs); }catch(e){ toast(esc(e.message)); return; } promptModal(p.system, p.messages, 'PREVIEW — what Send will send', false, p.sha256); }
async function showProbeUsed(id){ let r; try{ r=await api('/api/probes/'+encodeURIComponent(id)); }catch(e){ toast(esc(e.message)); return; } promptModal(r.system, r.messages, 'SENT — from the probe log', true, r.sha256); }
/* Where the appended question starts in the last user message: the belief question prefix (cc_lib._BELIEF_PREFIX)
   or the resample cue for approximate agents. Neither found (e.g. a Claude Code resample) = nothing is highlighted. */
const Q_MARKERS=['(A pause before your next step', '(Your turn:'];
function questionStart(txt){ return Math.max(...Q_MARKERS.map(m=>txt.lastIndexOf(m))); }
function promptModal(system, messages, label, sent, sha){
  const text=`SYSTEM\n${system}\n\n`+(messages||[]).map(m=>`[${m.t||m.role}]\n${m.text!=null?m.text:JSON.stringify(m)}`).join('\n\n');
  const bg=document.createElement('div'); bg.className='modal-bg';
  const msgs=(messages||[]).map((m,i)=>{ const last=i===messages.length-1&&(m.t==='user'||m.role==='user'); const txt=m.text!=null?m.text:JSON.stringify(m.input||m,null,2);
    const k=last?questionStart(txt):-1;
    const bh=k>=0?`${esc(txt.slice(0,k))}<span class="qhl">${esc(txt.slice(k))}</span>`:esc(txt);
    return `<div class="pmsg"><div class="role">[${esc(m.t||m.role)}] <span style="font-weight:400">· ${fmt(txt.split('\n').length)} lines</span></div><pre>${bh}</pre></div>`; }).join('');
  bg.innerHTML=`<div class="modal" role="dialog" aria-label="Exact prompt"><div class="mh2"><span class="src${sent?' sent':''}">${esc(label)}</span><span class="faint">${fmt(text.length)} chars · ~${fmt(Math.round(text.length/4))} tokens${sha?` · sha256 ${esc(String(sha).slice(0,12))}…`:''}</span><span style="margin-left:auto"></span>
    <div class="seg"><button data-pt="sys">System</button><button data-pt="msg" class="on">Messages</button><button data-pt="raw">Raw JSON</button></div><button data-copyt>Copy</button><button data-close>✕</button></div>
    <div class="mb"><div data-pane="msg">${msgs}</div><div data-pane="sys" style="display:none"><pre>${esc(system)}</pre></div><div data-pane="raw" style="display:none"><pre>${esc(JSON.stringify({system,messages},null,2))}</pre></div></div></div>`;
  document.body.appendChild(bg); const close=()=>{ bg.remove(); document.removeEventListener('keydown',kd,true); }; const kd=ev=>{ if(ev.key==='Escape'){ ev.stopPropagation(); close(); } }; document.addEventListener('keydown',kd,true);
  bg.addEventListener('click', ev=>{ if(ev.target===bg) close(); const b=ev.target.closest('button'); if(!b) return; if(b.dataset.close!=null) close();
    if(b.dataset.pt){ bg.querySelectorAll('[data-pt]').forEach(x=>x.classList.toggle('on',x===b)); bg.querySelectorAll('[data-pane]').forEach(p=>p.style.display=p.dataset.pane===b.dataset.pt?'':'none'); }
    if(b.dataset.copyt!=null) navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>toast('Copied')); });
}
async function showHistory(){ const A=S.ask; if(!A) return; const s=A.spec; const q=s.target==='tierb'?`ei=${s.ei}`:s.at_ei!=null?`ei=${s.at_ei}`:`seg_id=${s.seg_id}`;
  let here=[], all=[]; try{ [here, all]=await Promise.all([api('/api/probes?'+q+'&limit=50'), api('/api/probes?limit=40')]); }catch(e){}
  const row=p=>`<div class="mi" data-probe="${esc(p.probe_id)}"><b>${esc(agentName(p.agent))}</b> · ${esc(p.question||p.text_preview||p.mode||'')}<span class="r2">d${esc(p.day??'?')}</span></div>`;
  const roots=here.filter(p=>!p.parent_id), recent=all.filter(p=>!p.parent_id);
  const m=openMenu($('#optsbtn'), `<div class="mh">At this moment · ${roots.length}</div>${roots.map(row).join('')||'<div class="mi faint">none yet</div>'}<div class="mh">All recent questions</div>${recent.map(row).join('')||'<div class="mi faint">none yet</div>'}`);
  m.addEventListener('click', ev=>{ const p=ev.target.closest('[data-probe]'); if(p){ closeMenu(); location.hash='#/probe/'+p.dataset.probe; } }); }
async function openProbePermalink(id){
  let r; try{ r=await api('/api/probes/'+encodeURIComponent(id)); }catch(e){ toast("Couldn't open that question: "+esc(e.message)); location.hash='#/'; return; }
  let root=r; for(let g=0; root.parent_id && g<50; g++){ try{ root=await api('/api/probes/'+root.parent_id); }catch(e){ break; } }
  const res=root.resolved||{}; const day=root.day;
  if(day!=null){ await revealDay(day); S._curDay=day; S._lastHashDay=day; if(res.ei!=null) S.sel='m'+res.ei; }
  const spec = root.target==='cc' ? (res.match==='time' || res.match==='posting_turn' ? {target:'cc', at_ei:res.ei, anchor:res.anchor==='before'?'before':'after'} : {target:'cc', seg_id:res.seg_id, seq:res.seq}) : {target:'tierb', agent:root.agent, ei:res.ei, anchor:root.anchor||res.anchor||'after', window:root.window||80, format:root.format||'transcript'};
  spec.mode=root.mode; openAsk(spec,{fromHash:true});
  const kids=[]; try{ const chain=await api('/api/probes?'+(res.ei!=null?'ei='+res.ei:'seg_id='+res.seg_id)+'&limit=200'); const byP=new Map(chain.filter(p=>p.parent_id).map(p=>[p.parent_id,p])); let cur=root.probe_id;
    while(byP.has(cur)){ const k=byP.get(cur); const full=await api('/api/probes/'+k.probe_id).catch(()=>null); if(!full) break; kids.push({probe_id:full.probe_id, question:full.question, status:full.status, text:full.text, error:full.error, stop_reason:full.stop_reason}); cur=k.probe_id; } }catch(e){}
  S.ask.cards=[{job_id:'p-'+root.probe_id, probe_id:root.probe_id, status:root.status||'done', result:root, question:root.question, mode:root.mode, model:root.model, agent:root.agent, followups:kids}];
  history.replaceState(null,'',buildHash()); render(S.sel?{scrollTo:{key:S.sel}}:{}); renderAsk();
}
async function toggleStar(ei){ const s=(S.stars||[]).find(x=>x.ei===ei);
  try{ if(s) await post('/api/stars',{op:'remove', id:s.id}); else await post('/api/stars',{op:'add', ei}); S.stars=await api('/api/stars'); }catch(e){ toast(esc(e.message)); return; }
  const f=findEv(ei); if(f) f.e.star=!s; const fe=S.ev.get(ei); if(fe) fe.star=!s; render(); toast(s?'Unstarred':'Starred'); }

/* ------------------------------------------ View menu ------------------------------------------ */
function viewMenu(btn){
  const V=S.view; const cb=(k,l,h)=>`<label class="mi"><input type="checkbox" data-v="${k}" ${V[k]?'checked':''}> ${esc(l)}<span class="r2">${esc(h||'')}</span></label>`;
  const m=openMenu(btn, `<div class="mh">Add detail</div>${cb('act','Activity events','computer use, pauses, searches')}${cb('strip','Overview strip','every day at a glance')}${cb('lanes','Room lanes','rooms as branches')}
    <div class="mh">Layout</div>${cb('newest','Newest first','')}${cb('compact','Compact rows','')}
    <div class="mh">Search</div><label class="mi"><input type="checkbox" data-hitsonly ${S.hitsOnly?'checked':''}> Only show matching messages<span class="r2">while searching</span></label>
    <div class="mh">Other</div><div class="mi" data-focuspick>Focus an agent…</div><div class="mi" data-collapse>Close the open day</div>${S.startDismissed?'<div class="mi" data-restart>Show the “Start here” row</div>':''}`);
  m.addEventListener('change', ev=>{ const t=ev.target; if(t.dataset.v){ S.view[t.dataset.v]=t.checked; saveViewPrefs(); render(); drawStrip(); } if(t.dataset.hitsonly!=null){ S.hitsOnly=t.checked; render(); } });
  m.addEventListener('click', ev=>{ const t=ev.target.closest('.mi'); if(!t) return;
    if(t.dataset.collapse!=null){ S.open.days.clear(); S.open.msgs.clear(); S.cc.clear(); S._curDay=null; closeMenu(); render(); $('#tlpane').scrollTop=0; replaceHash(); }
    if(t.dataset.restart!=null){ S.startDismissed=false; ls('startDismissed','0'); closeMenu(); render(); }
    if(t.dataset.focuspick!=null){ closeMenu(); focusPicker(btn); } });
}
function focusPicker(btn){
  const groups=['anthropic','openai','google','other'].map(f=>{ const as=S.ov.agents.filter(a=>a.family_group===f&&a.n_msgs); return as.length?`<div class="mh">${FGNAME[f]}</div>${as.map(a=>`<div class="mi" data-pick="${esc(a.slug)}" data-name="${esc(a.name.toLowerCase())}">${dot(f)}${esc(a.name)}${S.focus.includes(a.slug)?' ✓':''}<span class="r2">d${esc(a.first_day)}–${esc(a.last_day)}</span></div>`).join('')}`:''; }).join('');
  const m=openMenu(btn, `<input type="text" placeholder="Focus an agent… (shift-click adds)" data-filter>${groups}`);
  m.querySelector('[data-filter]').addEventListener('input', ev=>{ const v=ev.target.value.toLowerCase(); m.querySelectorAll('[data-pick]').forEach(x=>x.style.display=x.dataset.name.includes(v)?'':'none'); });
  m.addEventListener('click', ev=>{ const p=ev.target.closest('[data-pick]'); if(!p) return; closeMenu(); toggleFocus(p.dataset.pick, ev.shiftKey); });
}

/* ------------------------------------------ keyboard ------------------------------------------ */
const KEYS=[['/','search'],['j  k  (↓ ↑)','move down / up'],['→  Enter','open the selected row'],['←','close it (or go to its parent)'],['a','ask the selected message\'s agent'],['n  N','next / previous search hit'],['f','focus the selected agent'],['[  ]','previous / next day'],['⌘/Ctrl+Enter','send the question'],['Esc','close menus → the Ask pane → search → selection'],['?','this help']];
function showHelp(){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal help-ov" style="height:auto;width:min(520px,92vw)"><div class="mh2"><b>Keyboard</b><span style="margin-left:auto"></span><button data-close>✕</button></div><div class="mb"><table>${KEYS.map(([k,v])=>`<tr><td><span class="kbd">${esc(k)}</span></td><td>${esc(v)}</td></tr>`).join('')}</table>
  <p class="muted" style="font-size:12.5px;margin-top:12px">The timeline: goals → days → messages, each opening in place. The lines on the left are chat rooms: #general is the trunk; #best/#rest branch off when the village split into rooms and merge back when everyone returned to #general.</p></div></div>`;
  document.body.appendChild(bg); bg.addEventListener('click',ev=>{ if(ev.target===bg||ev.target.closest('[data-close]')) bg.remove(); }); }
function onKey(ev){
  const tag=(ev.target.tagName||'').toLowerCase(); const typing=tag==='input'||tag==='textarea'||tag==='select';
  if((ev.metaKey||ev.ctrlKey) && ev.key==='Enter'){ if(S.ask){ ev.preventDefault(); sendProbe(); } return; }
  if(ev.key==='Escape'){ if(_menu){ closeMenu(); return; } if(document.querySelector('.modal-bg')) return; if(typing){ ev.target.blur(); return; }
    if(S.ask&&S.ask.optsOpen){ S.ask.optsOpen=false; renderOpts(); return; } if(S.ask){ closeAsk(); return; } if(S.q){ clearSearch(); return; } if(S.sel){ S.sel=null; render(); replaceHash(); } return; }
  if(typing||ev.metaKey||ev.ctrlKey||ev.altKey) return;
  const idx=_rows.findIndex(r=>r.key===S.sel); const cur=_rows[idx];
  const move=d=>{ let i=idx<0?(d>0?-1:_rows.length):idx; for(;;){ i+=d; if(i<0||i>=_rows.length) return; if(!['util','gap','start','dayend'].includes(_rows[i].t)) break; }
    const r=_rows[i]; setSel(r.key); const el=document.querySelector(`#tl .r[data-key="${CSS.escape(r.key)}"]`); if(el) el.scrollIntoView({block:'nearest'}); };
  const isOpen=r=>(r.t==='day'&&S.open.days.has(r.day))||(r.t==='about'&&S.open.about.has(r.day))||(r.t==='turn'&&r.cc.open.has(r.i));
  switch(ev.key){
    case '/': ev.preventDefault(); $('#q').focus(); $('#q').select(); break;
    case 'j': case 'ArrowDown': ev.preventDefault(); move(1); break;
    case 'k': case 'ArrowUp': ev.preventDefault(); move(-1); break;
    case 'ArrowRight': case 'Enter': if(cur){ ev.preventDefault(); if(!isOpen(cur)||ev.key==='Enter') activateRow(cur.key); } break;
    case 'ArrowLeft': { ev.preventDefault(); const d=[...S.open.days][0]; if(cur && isOpen(cur) && cur.t!=='day') activateRow(cur.key); else if(d!=null) closeDay(d); } break;
    case 'a': if(cur&&cur.t==='msg'&&cur.ev.k==='c'){ if(!cur.ev.h) askSelf(cur.ev.ei); else { const el=document.querySelector(`#tl .r[data-key="${CSS.escape(cur.key)}"] .b`); if(el) askOtherMenu(cur.ev.ei, el); } } break;
    case 'n': stepHit(1); break; case 'N': stepHit(-1); break;
    case 'f': if(cur&&cur.t==='msg'&&cur.ev.slug&&!cur.ev.h) toggleFocus(cur.ev.slug); break;
    case '[': case ']': { const d=S._curDay; const nd = d==null ? S.activeDays[0] : ev.key===']' ? S.activeDays.find(x=>x>d) : S.activeDays.filter(x=>x<d).pop(); if(nd!=null) openDay(nd); } break;
    case '?': showHelp(); break;
  }
}

/* ------------------------------------------ wiring ------------------------------------------ */
function wire(){
  wireTimeline(); wireAsk(); wireStrip();
  const q=$('#q'), sug=$('#suggest');
  q.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); sug.style.display='none'; q.blur(); runSearch(q.value); } });   // blur so n / N step through hits right away
  q.addEventListener('focus', ()=>{ if(!q.value){ sug.innerHTML=`<div class="faint">Try</div><div class="chips">${['"ganging up"','from:gemini-2-5-pro struggling','about:gemini-2-5-pro day:440-452','in:thinking Gemini distress','from:operator goal'].map(x=>`<span class="chip" data-ex="${esc(x)}">${esc(x)}</span>`).join('')}</div>
    <div class="muted" style="line-height:1.7">Words are ANDed · <code>"phrase"</code> · <code>from:agent|family|operator</code> · <code>about:agent</code> (≈ mentions) · <code>room:general</code> · <code>day:440-452</code> · <code>in:thinking</code><br>Jump: <code>447</code> · <code>2026-06-22</code> · <code>ei:263749</code></div>`; sug.style.display='block'; } });
  q.addEventListener('input', ()=>{ sug.style.display=q.value?'none':'block'; $('#qclear').style.display=q.value?'block':'none'; });
  q.addEventListener('blur', ()=>setTimeout(()=>{ sug.style.display='none'; },150));
  sug.addEventListener('mousedown', ev=>{ const c=ev.target.closest('[data-ex]'); if(c){ ev.preventDefault(); q.value=c.dataset.ex; sug.style.display='none'; runSearch(c.dataset.ex); } });
  $('#qclear').addEventListener('click', ()=>clearSearch());
  $('#viewbtn').addEventListener('click', ev=>{ if(S.ov) viewMenu(ev.currentTarget); });
  $('#helpbtn').addEventListener('click', showHelp);
  $('#focuschips').addEventListener('click', ev=>{ const b=ev.target.closest('[data-unfocus]'); if(b) toggleFocus(b.dataset.unfocus); });
  $('#focuschips').addEventListener('change', ev=>{ if(ev.target.id==='onlyfocus'){ S.only=ev.target.checked; render(); replaceHash(); } });
  $('#jobs').addEventListener('click', ev=>{ const list=[...S.jobs.values()]; const m=openMenu(ev.currentTarget, `<div class="mh">Being answered</div>${list.map(j=>`<div class="mi" data-probe="${esc(j.probe_id)}">${esc((j.target&&j.target.question)||'(question)')}<span class="r2">${Math.round((Date.now()-j.t0)/1000)}s</span></div>`).join('')||'<div class="mi faint">none</div>'}`);
    m.addEventListener('click', e2=>{ const p=e2.target.closest('[data-probe]'); if(p){ closeMenu(); location.hash='#/probe/'+p.dataset.probe; } }); });
  $('#themebtn').addEventListener('click', ()=>{ const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const n=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=n; ls('theme',n); drawStrip(); });
  document.addEventListener('keydown', onKey);
}
boot();
